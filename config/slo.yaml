service: day13-l3a-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >-
    SLI = response_sent voi latency_ms <= 3000 / request_received trong 28 ngay.
    Baseline FakeLLM + retrieval thuong: P95 ~150-300ms, P99 < 600ms khi khong co
    incident, nen nguong 3000ms chi kich hoat khi retrieval cham (rag_slow sleep
    2.5s) hoac loi. Error budget = 0.5% * 28 ngay = 0.005*28*24*60 = 201.6 phut
    (~3.36 gio) request cham/loi cho phep moi 28 ngay truoc khi vi pham SLO.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
